name: Build and verify

on:
  push:
    paths-ignore:
      - '**.md'
      - '.changelog/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.changelog/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-24.04
    env:
      TOOLCHAINS: >-
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Read project version
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' build.gradle.kts | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Tebex $version"
      - name: Show detected toolchains
        run: ./gradlew -q javaToolchains $TOOLCHAINS
      - name: Build all artifacts
        run: ./gradlew build --max-workers=2 --no-parallel --console=plain $TOOLCHAINS
      - name: Verify migration and artifacts
        run: ./gradlew verifyMigration --max-workers=2 --no-parallel --console=plain $TOOLCHAINS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            tebex-minecraft-runtime/build/reports/tests/
            bukkit/build/reports/tests/
            bungeecord/build/reports/tests/
            velocity/build/reports/tests/
            tebex-java-sdk/tbx/build/reports/tests/
            tebex-java-sdk/headless-api/build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tebex-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: builds/*.jar
          if-no-files-found: error
          retention-days: 30
